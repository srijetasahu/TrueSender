# Server
server.port=8080

# H2 embedded database (file-based, stored in ./data/truesender.mv.db)
spring.datasource.url=jdbc:h2:file:./data/truesender
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console (useful for debugging - visit /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Python ML service URL (Member 1's FastAPI service)
ml.service.base-url=${ML_SERVICE_BASE_URL:http://127.0.0.1:8000}
ml.service.timeout-ms=5000

# Thymeleaf
spring.thymeleaf.cache=false
